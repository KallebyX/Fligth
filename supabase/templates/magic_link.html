<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seu link de acesso — Capitão Lorí</title>
  </head>
  <body style="margin:0;padding:0;background:#F1F5F9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0F172A;">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background:#F1F5F9;padding:32px 0;">
      <tr>
        <td align="center">
          <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="max-width:480px;background:#FFFFFF;border-radius:24px;box-shadow:0 6px 24px rgba(16,185,129,0.12);overflow:hidden;">
            <tr>
              <td style="background:#10B981;padding:36px 24px 24px;text-align:center;color:#FFFFFF;">
                <div style="font-size:14px;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;opacity:0.9;">Capitão Lorí</div>
                <h1 style="margin:8px 0 0;font-size:28px;line-height:1.2;font-weight:900;">Seu link de acesso</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 32px 8px;text-align:left;font-size:15px;line-height:1.55;color:#334155;">
                <p style="margin:0 0 14px;">Toque no botão para entrar direto no app, sem precisar de senha.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 4px;text-align:center;">
                <a href="{{ .ConfirmationURL }}"
                   style="display:inline-block;background:#10B981;color:#FFFFFF;text-decoration:none;font-weight:800;font-size:16px;padding:14px 24px;border-radius:9999px;box-shadow:0 4px 12px rgba(16,185,129,0.35);">
                  Entrar no Capitão Lorí
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 32px 28px;text-align:center;font-size:13px;color:#64748B;">
                O link expira em 1 hora. Não compartilhe — quem tiver esse link consegue entrar na sua conta.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
