<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirme seu novo email — Comandante Lorí</title>
  </head>
  <body style="margin:0;padding:0;background:#F1F5F9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0F172A;">
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background:#F1F5F9;padding:32px 0;">
      <tr>
        <td align="center">
          <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="max-width:480px;background:#FFFFFF;border-radius:24px;box-shadow:0 6px 24px rgba(99,102,241,0.12);overflow:hidden;">
            <tr>
              <td style="background:#6366F1;padding:36px 24px 24px;text-align:center;color:#FFFFFF;">
                <div style="font-size:14px;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;opacity:0.9;">Comandante Lorí</div>
                <h1 style="margin:8px 0 0;font-size:28px;line-height:1.2;font-weight:900;">Confirme o novo email</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 32px 8px;text-align:left;font-size:15px;line-height:1.55;color:#334155;">
                <p style="margin:0 0 14px;">Você pediu para trocar o email da sua conta de <strong>{{ .Email }}</strong> para <strong>{{ .NewEmail }}</strong>.</p>
                <p style="margin:0 0 14px;">Confirme o novo email tocando no botão. O link expira em 1 hora.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 4px;text-align:center;">
                <a href="{{ .ConfirmationURL }}"
                   style="display:inline-block;background:#6366F1;color:#FFFFFF;text-decoration:none;font-weight:800;font-size:16px;padding:14px 24px;border-radius:9999px;box-shadow:0 4px 12px rgba(99,102,241,0.35);">
                  Confirmar novo email
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 32px 28px;text-align:center;font-size:12px;color:#94A3B8;">
                Se você não solicitou essa mudança, ignore este email.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
