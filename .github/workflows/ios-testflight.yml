name: iOS → TestFlight

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: "TestFlight changelog (visible to internal testers)"
        required: false
        default: "Build automated via GitHub Actions."
  push:
    branches:
      - main
      # Allow the active feature branch to also trigger TestFlight builds
      # so we can test mid-PR without merging. Remove once the branch is
      # merged.
      - "claude/anac-pilot-training-app-sVhHF"
    paths:
      - "ios/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - "fastlane/**"
      - ".github/workflows/ios-testflight.yml"

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    name: Archive + Upload TestFlight
    # macos-26 ships Xcode 26 + iOS 26 SDK, which Apple requires for all
    # TestFlight/App Store submissions starting April 2026.
    runs-on: macos-26
    timeout-minutes: 60

    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      APP_STORE_CONNECT_KEY_IS_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_IS_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      TESTFLIGHT_CHANGELOG: ${{ github.event.inputs.changelog }}
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load SSH deploy key for capitaolori-certs (match)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}

      - name: Trust github.com SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node deps
        run: npm ci --no-audit --no-fund

      - name: Capacitor sync (regenerates ios/App from latest web)
        run: npm run mobile:sync

      - name: Use Ruby 3.2 (with bundler cache)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Select Xcode 26 (iOS 26 SDK)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Print versions
        run: |
          xcodebuild -version
          ruby --version
          bundle exec fastlane --version
          pod --version

      - name: Fastlane beta (archive + TestFlight upload)
        run: bundle exec fastlane ios beta

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            build/**
            ~/Library/Logs/gym/*.log
            ~/Library/Logs/scan/*.log
          if-no-files-found: ignore
